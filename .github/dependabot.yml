version: 2
updates:
  # npm workspace: the single root package-lock.json covers every workspace
  # (packages/*, apps/*, benchmarks/runners). One entry here is what makes the
  # lockfile updates land on the root; empty package-ecosystem/directory values
  # are not a valid update entry, and listing apps/web separately would only
  # produce the "dependency_file_not_supported" job seen in run 35332690819,
  # since a workspace child has no lockfile of its own.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Keep the workflow actions (checkout / setup-node) current too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
