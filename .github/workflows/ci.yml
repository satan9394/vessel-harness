name: CI

# Least privilege: this workflow only checks out and reads the repo (npm cache is
# not a token scope). Without an explicit block the GITHUB_TOKEN inherits the
# repo default, which is broader than any step here needs
# (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci uses the committed package-lock.json for a reproducible install.
      # On a stale/divergent lockfile npm ci can fail; running npm install then
      # re-syncs the lockfile and deps so the build/test steps below still run.
      # A lockfile mismatch should be fixed in the repo, not masked silently.
      - name: Install dependencies
        run: npm ci || npm install

      - name: Build (tsc -b)
        run: npm run build

      # Test files are excluded from the composite build (tsconfig.base.json),
      # because the cross-package imports they carry cannot all be expressed as
      # project references without creating a cycle. Vitest runs them through
      # esbuild, which never type-checks, so this non-composite pass is what
      # keeps *.test.ts under tsc's eye. It resolves @vessel/* to sources via
      # the same paths as vitest.config.ts, so it needs no build output.
      - name: Typecheck tests
        run: npm run typecheck:tests

      # apps/web is not part of `tsc -b` (its tsconfig is standalone, noEmit) and
      # `test:all` only runs its vitest suite, so its production build was the one
      # path nothing checked. That is how an unmet peer dependency slipped through
      # when vite went to 8 while @vitejs/plugin-react stayed on 7's range: the
      # build emits the mismatch, the tests never load the vite config's plugins
      # the same way. `vite build` + a tsc pass gates both.
      - name: Typecheck web
        run: npm run -w @vessel/web typecheck

      - name: Build web (vite)
        run: npm run -w @vessel/web build

      # NOTE — known Windows flake (repo-wide, see tasks/036 + task 034):
      # some atomic-rename tests (e.g. apps/cli/src/usage/UsageStore) intermittently
      # hit `EPERM: operation not permitted, rename '...tmp' -> '...json'` when
      # Windows Defender/indexer momentarily locks the temp file. It is transient —
      # the same file passes on re-run. We deliberately do NOT use
      # continue-on-error here so real test regressions still fail the job;
      # a flaky hit is resolved by re-running the failed check.
      #
      # `test:all` = BOTH vitest roots: the repo root (vitest.config.ts) AND
      # `--root apps/web` (apps/web has its own vitest config; the root `include`
      # deliberately does not scan apps/web). Running only `npm test` silently left
      # the web suite out of CI (discipline 26).
      - name: Test (vitest — root + apps/web)
        run: npm run test:all

      - name: Smoke — CLI version
        run: node apps/cli/dist/cli.js --version

      - name: Smoke — CLI run (mock)
        run: node apps/cli/dist/cli.js run --prompt "你好"