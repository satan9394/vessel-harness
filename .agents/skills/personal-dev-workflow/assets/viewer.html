<!doctype html>
<html lang="zh-CN" data-mode="light" data-pref="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDW · 任务进度</title>
<script>
(function () {
  var pref = 'system';
  try { pref = localStorage.getItem('pdw-viewer-theme') || 'system'; } catch (e) {}
  var forced = new URLSearchParams(location.search).get('pref');
  if (forced && ['light','dark','system'].indexOf(forced) >= 0) pref = forced;
  var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.mode = dark ? 'dark' : 'light';
  document.documentElement.dataset.pref = pref;
  if (new URLSearchParams(location.search).get('motion') === 'static') document.documentElement.classList.add('motion-static');
})();
</script>
<style>
  :root{
    --bg:#f7f8fb;
    --ink:#10131c; --ink-2:#3f4657; --ink-3:#6c7587; --ink-4:#9aa3b2;
    --face-1:rgba(255,255,255,.55); --face-2:rgba(255,255,255,.66); --face-3:rgba(255,255,255,.78);
    --face-4:rgba(255,255,255,.86); --face-5:rgba(255,255,255,.94); --face-solid:#fff;
    --edge-1:rgba(255,255,255,.9); --edge-2:rgba(255,255,255,.98);
    --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.8); --glass-line:rgba(255,255,255,.9);
    --line:rgba(16,19,28,.08); --line-2:rgba(16,19,28,.05);
    --ok-ink:#22785f; --ok-bg:rgba(134,232,214,.36);
    --fail-ink:#a8415f; --fail-bg:rgba(255,184,212,.38);
    --run-ink:#33578f; --run-bg:rgba(147,186,255,.34);
    --idle-ink:#6c7587; --idle-bg:rgba(16,19,28,.05);
    --shadow-lg:0 30px 60px -34px rgba(38,44,82,.34), 0 8px 24px -14px rgba(38,44,82,.14);
    --shadow-sm:0 10px 24px -16px rgba(38,44,82,.3), 0 2px 8px -4px rgba(38,44,82,.1);
    --aurora-op:.5; --aurora-blur:blur(58px) saturate(126%);
    --g1:#86e8d6; --g2:#93baff; --g3:#c4a9ff; --g4:#ffb8d4; --g5:#a8e4ff;
    --r-xl:22px; --r-lg:18px; --r-md:12px;
    --mono:"JetBrains Mono","SF Mono","Cascadia Code",Consolas,monospace;
    --font:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color-scheme: light;
  }
  html[data-mode="dark"]{
    --bg:#06070e;
    --ink:#eef2ff; --ink-2:#c3cbe8; --ink-3:#8791b4; --ink-4:#5f688a;
    --face-1:rgba(255,255,255,.04); --face-2:rgba(255,255,255,.05); --face-3:rgba(255,255,255,.06);
    --face-4:rgba(255,255,255,.075); --face-5:rgba(255,255,255,.09); --face-solid:#0f1220;
    --edge-1:rgba(255,255,255,.10); --edge-2:rgba(255,255,255,.14);
    --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.09); --glass-line:rgba(255,255,255,.14);
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.05);
    --ok-ink:#6ff0c0; --ok-bg:rgba(77,255,195,.14);
    --fail-ink:#ff9ec0; --fail-bg:rgba(255,62,165,.16);
    --run-ink:#a8c8ff; --run-bg:rgba(79,139,255,.18);
    --idle-ink:#8791b4; --idle-bg:rgba(255,255,255,.06);
    --shadow-lg:0 30px 60px -34px rgba(0,0,0,.9), 0 8px 24px -14px rgba(0,0,0,.65);
    --shadow-sm:0 10px 24px -16px rgba(0,0,0,.8), 0 2px 8px -4px rgba(0,0,0,.5);
    --aurora-op:.22; --aurora-blur:blur(72px) saturate(152%) brightness(1.12);
    --g1:#2ee6ff; --g2:#ff3ea5; --g3:#8b5cff; --g4:#4dffc3; --g5:#4f8bff;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--font);transition:background .24s ease,color .24s ease}

  .aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;opacity:var(--aurora-op);pointer-events:none;
    -webkit-mask-image:radial-gradient(125% 110% at 0% 0%, #000 0%, rgba(0,0,0,.5) 46%, transparent 78%);
    mask-image:radial-gradient(125% 110% at 0% 0%, #000 0%, rgba(0,0,0,.5) 46%, transparent 78%)}
  .aurora i{position:absolute;border-radius:50%;filter:var(--aurora-blur)}
  .aurora .b1{width:52vmax;height:52vmax;left:-14vmax;top:-18vmax;background:var(--g1)}
  .aurora .b2{width:46vmax;height:46vmax;right:-12vmax;top:-14vmax;background:var(--g2)}
  .aurora .b3{width:56vmax;height:56vmax;right:-10vmax;bottom:-24vmax;background:var(--g3)}
  .aurora .b4{width:44vmax;height:44vmax;left:-10vmax;bottom:-20vmax;background:var(--g4)}
  .aurora .b5{width:34vmax;height:34vmax;left:38%;top:42%;background:var(--g5);opacity:.5}
  html[data-mode="dark"] .aurora i{transform:scale(.78)}
  html[data-mode="dark"] .aurora::after{content:"";position:absolute;inset:0;
    background:radial-gradient(66% 56% at 50% 42%, rgba(3,4,10,.82), rgba(3,4,10,.46) 62%, transparent 100%)}

  .bloom{position:fixed;inset:-18% -10%;z-index:-1;pointer-events:none;opacity:.42;overflow:hidden}
  .bloom i{position:absolute;border-radius:50%;will-change:transform;transform:translate3d(0,0,0)}
  .bloom .m1{width:58vmax;height:58vmax;left:-8vmax;top:-16vmax;
    background:radial-gradient(circle at 50% 50%, var(--g1) 0%, transparent 62%);animation:drift-a 26s ease-in-out infinite alternate}
  .bloom .m2{width:52vmax;height:52vmax;right:-10vmax;top:-10vmax;
    background:radial-gradient(circle at 50% 50%, var(--g3) 0%, transparent 64%);animation:drift-b 34s ease-in-out infinite alternate}
  .bloom .m3{width:56vmax;height:56vmax;right:-6vmax;bottom:-20vmax;
    background:radial-gradient(circle at 50% 50%, var(--g4) 0%, transparent 66%);animation:drift-c 42s ease-in-out infinite alternate}
  html[data-mode="dark"] .bloom{opacity:.3}
  @keyframes drift-a{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(9vmax,5vmax,0) scale(1.14)}}
  @keyframes drift-b{from{transform:translate3d(0,0,0) scale(1.06)}to{transform:translate3d(-10vmax,7vmax,0) scale(.94)}}
  @keyframes drift-c{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-7vmax,-6vmax,0) scale(1.1)}}
  @media (prefers-reduced-motion: reduce){.bloom{display:none}}
  html.motion-static .bloom i{animation:none}

  .shell{display:grid;grid-template-columns:262px 1fr;gap:14px;height:100vh;padding:14px}
  @media(max-width:940px){.shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

  .card{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r-lg);
    backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%);
    box-shadow:var(--shadow-sm)}

  /* ---------- 侧栏 ---------- */
  aside{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  aside .brand{padding:15px 15px 8px}
  aside .brand .name{font-size:15px;font-weight:600}
  aside .brand .path{color:var(--ink-3);font-size:11.5px;margin-top:2px;word-break:break-all}
  .filters{display:flex;gap:5px;padding:4px 12px 8px;flex-wrap:wrap}
  .filters button{appearance:none;border:1px solid var(--edge-1);background:var(--face-2);color:var(--ink-3);
    border-radius:999px;padding:3px 10px;font:12px/1.6 var(--font);cursor:pointer;transition:.16s}
  .filters button:hover{color:var(--ink)}
  .filters button[aria-pressed="true"]{background:var(--face-5);color:var(--ink);border-color:var(--edge-2);box-shadow:var(--shadow-sm)}
  .filters button b{font-weight:600;margin-left:3px}

  .list{overflow:auto;flex:1;min-height:0;padding:0 10px 10px;
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent 100%);
    mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent 100%)}
  .group{margin:6px 0 2px;color:var(--ink-4);font-size:11px;letter-spacing:.3px;padding-left:8px}
  .item{padding:8px 9px;border-radius:var(--r-md);border:1px solid transparent;cursor:pointer;margin-bottom:3px;
    transition:background .16s ease,box-shadow .16s ease}
  .item:hover{background:var(--face-3)}
  .item.on{background:var(--face-5);border-color:var(--edge-2);box-shadow:var(--shadow-sm)}
  .item .l1{display:flex;align-items:center;gap:7px;min-width:0}
  .item .goal{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
  .item .l2{display:flex;gap:8px;margin-top:2px;color:var(--ink-3);font-size:11.5px;padding-left:2px}
  .item .l2 .time{margin-left:auto;font-family:var(--mono)}

  .pill{flex:none;font-size:11.5px;line-height:1.75;padding:0 7px;border-radius:999px;white-space:nowrap}
  .pill.ok{color:var(--ok-ink);background:var(--ok-bg)}
  .pill.fail{color:var(--fail-ink);background:var(--fail-bg)}
  .pill.run{color:var(--run-ink);background:var(--run-bg)}
  .pill.idle{color:var(--idle-ink);background:var(--idle-bg)}

  /* 额度 */
  .quota{border-top:1px solid var(--line);padding:11px 14px 13px}
  .quota .qh{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:600;margin-bottom:8px}
  .quota .qh span{margin-left:auto;font-weight:400;color:var(--ink-3);font-size:11px}
  .qrow{display:grid;grid-template-columns:44px 1fr 40px;gap:8px;align-items:center;margin-bottom:3px}
  .qrow .k{font-size:11.5px;color:var(--ink-3)}
  .qrow .v{font-size:11.5px;text-align:right;font-family:var(--mono);color:var(--ink-2)}
  .qbar{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden}
  .qbar i{display:block;height:100%;border-radius:3px;background:var(--g1);transition:width .3s ease}
  .qbar.warn i{background:var(--g4)} .qbar.full i{background:var(--fail-ink)}
  .qnote{font-size:10.5px;color:var(--ink-4);margin:0 0 7px 52px}
  .qfoot{font-size:10.5px;color:var(--ink-4);line-height:1.6;font-family:var(--mono);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- 主区 ---------- */
  main{display:grid;grid-template-rows:auto 1fr;gap:12px;min-height:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:9px 14px}
  .topbar .title{font-size:13px;color:var(--ink-3);font-family:var(--mono)}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px}
  .live .dot{width:7px;height:7px;border-radius:50%;background:var(--g1);box-shadow:0 0 0 3px color-mix(in srgb,var(--g1) 22%,transparent)}
  .live.off .dot{background:var(--ink-4);box-shadow:none}
  .tswitch{display:inline-flex;background:var(--face-3);border:1px solid var(--edge-1);border-radius:999px;padding:2px;gap:2px}
  .tswitch button{appearance:none;border:0;background:transparent;color:var(--ink-3);cursor:pointer;
    font:12px/1 var(--font);padding:5px 9px;border-radius:999px;transition:.18s}
  .tswitch button:hover{color:var(--ink)}
  .tswitch button[aria-pressed="true"]{background:var(--face-5);color:var(--ink);box-shadow:var(--shadow-sm)}

  .content{overflow:auto;padding:0 2px 40px;display:flex;flex-direction:column;gap:12px}
  .panel{padding:16px 18px}

  /* hero：一屏一个主角 */
  .hero{font-size:26px;font-weight:600;line-height:1.4;letter-spacing:.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero.ok{color:var(--ok-ink)} .hero.fail{color:var(--fail-ink)} .hero.run{color:var(--run-ink)}
  .hero-sub{margin-top:6px;font-size:13.5px;color:var(--ink-2)}
  .hero-sub code{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
  .hero-warn{margin-top:8px;display:inline-block;font-size:12.5px;color:var(--fail-ink);background:var(--fail-bg);
    border-radius:999px;padding:1px 10px}
  .meta{margin-top:8px;color:var(--ink-3);font-size:12.5px;font-family:var(--mono)}
  .goal{margin-top:12px;color:var(--ink-2);font-size:13.5px;line-height:1.75;cursor:pointer;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .goal.open{-webkit-line-clamp:unset}
  .goal b{color:var(--ink-3);font-weight:500;margin-right:6px}

  h3.sec{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;font-size:15px;color:var(--ink);font-weight:600}
  h3.sec .count{color:var(--ink-3);font-weight:400;font-size:12.5px}
  h3.sec .legend{margin-left:auto;color:var(--ink-3);font-weight:400;font-size:12px}

  /* 一条总时间带取代逐行时间条 */
  .timeline{position:relative;height:9px;border-radius:5px;background:var(--line-2);overflow:hidden;margin:2px 0 4px}
  .timeline i{position:absolute;top:0;height:100%;border-radius:5px;background:var(--ink-4);opacity:.55}
  .timeline i.ok{background:var(--g1);opacity:1}
  .timeline i.run{background:var(--g2);opacity:1}
  .timeline i.fail{background:var(--g4);opacity:1}
  .tl-caption{color:var(--ink-3);font-size:12px;margin-bottom:10px}

  .steps{display:flex;flex-direction:column;gap:2px}
  .step{display:grid;grid-template-columns:96px 1fr 78px 82px;gap:14px;align-items:center;
    min-height:44px;padding:0 12px;border-radius:10px;border-left:4px solid transparent;cursor:pointer;
    transition:background .16s ease}
  .step:hover{background:var(--face-3)}
  .step .title{font-size:15px;font-weight:500}
  .step .who{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .step .dur{font-size:12.5px;color:var(--ink-3);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .step .st{text-align:right}
  .step.ok{border-left-color:var(--ok-ink)} .step.run{border-left-color:var(--run-ink)}
  .step.fail{border-left-color:var(--fail-ink)} .step.idle{border-left-color:transparent}
  .step.idle .title{color:var(--ink-3)}
  .step.idle .who{color:var(--ink-4)}

  details{padding:1px 2px}
  details > summary{padding:10px 14px;cursor:pointer;font-size:14px;color:var(--ink-2);list-style:none;
    display:flex;gap:10px;align-items:baseline;border-radius:10px}
  details > summary:hover{background:var(--face-2)}
  details > summary::-webkit-details-marker{display:none}
  details > summary::before{content:"›";color:var(--ink-3);font-size:15px;transition:transform .18s ease;display:inline-block}
  details[open] > summary::before{transform:rotate(90deg)}
  details > summary .count{margin-left:auto;color:var(--ink-3);font-size:12.5px}
  details .body{padding:2px 14px 14px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--ink-3);font-weight:500;font-size:12px;padding:7px 9px;border-bottom:1px solid var(--line)}
  td{padding:7px 9px;border-bottom:1px solid var(--line-2);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--face-2)}
  .mono{font-family:var(--mono)}
  .ok-t{color:var(--ok-ink)} .fail-t{color:var(--fail-ink)} .dim{color:var(--ink-3)}
  .note{color:var(--ink-3);font-size:12.5px}
  .chips span{display:inline-block;border-radius:999px;padding:1px 9px;margin:0 6px 6px 0;
    font-size:11.5px;color:var(--ink-2);background:var(--face-3);border:1px solid var(--edge-1);font-family:var(--mono)}
  pre{margin:0;background:var(--face-2);border:1px solid var(--edge-1);border-radius:var(--r-md);padding:12px 14px;
    overflow:auto;max-height:320px;font:12.5px/1.7 var(--mono);color:var(--ink-2);white-space:pre-wrap;word-break:break-all}
  .ghost{appearance:none;border:1px solid var(--edge-1);background:var(--face-3);color:var(--ink-2);
    border-radius:999px;padding:4px 12px;font:12.5px/1.5 var(--font);cursor:pointer;transition:.18s}
  .ghost:hover{background:var(--face-5)}

  .drawer{position:fixed;top:0;right:0;width:min(560px,48vw);height:100%;z-index:20;
    background:var(--glass-2);border-left:1px solid var(--glass-line);
    backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
    box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
    transform:translateX(101%);transition:transform .2s cubic-bezier(.16,1,.3,1)}
  .drawer.open{transform:translateX(0)}
  .drawer .dh{display:flex;align-items:baseline;gap:10px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
  .drawer .dh b{font-size:13.5px}
  .drawer .dh span{color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drawer .dh button{margin-left:auto;background:var(--face-3);border:1px solid var(--edge-1);color:var(--ink-2);
    border-radius:999px;padding:3px 11px;font:12px var(--font);cursor:pointer}
  .drawer pre{flex:1;overflow:auto;margin:0;border:0;border-radius:0;background:transparent;max-height:none;padding:16px 18px}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="aurora"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div>
<div class="bloom"><i class="m1"></i><i class="m2"></i><i class="m3"></i></div>

<div class="shell">
  <aside class="card">
    <div class="brand">
      <div class="name" id="projectName">PDW</div>
      <div class="path" id="projectPath">—</div>
    </div>
    <div class="filters" id="filters">
      <button data-f="all" aria-pressed="true">全部 <b id="cAll">0</b></button>
      <button data-f="running" aria-pressed="false">进行中 <b id="cRun">0</b></button>
      <button data-f="blocked" aria-pressed="false">卡住 <b id="cBad">0</b></button>
    </div>
    <div class="list" id="tasks"></div>
    <div class="quota" id="quota"><div class="qh">Codex 剩余用量 <span>本地记录</span></div><div class="qfoot">读取中…</div></div>
  </aside>

  <main>
    <div class="topbar card">
      <span class="title" id="topTitle">—</span>
      <div class="right">
        <span class="live" id="live"><i class="dot"></i>只读</span>
        <div class="tswitch" id="themeSwitch" role="group" aria-label="主题">
          <button data-mode="light" title="浅色">浅色</button>
          <button data-mode="dark" title="深色">深色</button>
          <button data-mode="system" title="跟随系统">跟随系统</button>
        </div>
      </div>
    </div>
    <div class="content" id="detail"><div class="panel card note">从左边的任务列表里选一个。</div></div>
  </main>
</div>

<div class="drawer" id="drawer">
  <div class="dh"><b id="drawerTitle">详情</b><span id="drawerSub"></span><button id="drawerClose">关闭</button></div>
  <pre id="drawerBody">—</pre>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = ms => {
  if (ms == null) return '—';
  const s = Math.max(0, Math.round(ms/1000));
  if (s < 60) return s + ' 秒';
  const m = Math.floor(s/60);
  if (m < 60) return m + ' 分' + String(s%60).padStart(2,'0');
  return Math.floor(m/60) + ' 时' + String(m%60).padStart(2,'0');
};
const ago = iso => iso ? fmt(Date.now() - new Date(iso).getTime()) + '前' : '—';
const clock = iso => iso ? new Date(iso).toTimeString().slice(0,5) : '—';
const dayKey = iso => { const d = new Date(iso); const t = new Date(); const y = new Date(Date.now()-864e5);
  if (d.toDateString() === t.toDateString()) return '今天';
  if (d.toDateString() === y.toDateString()) return '昨天';
  return '更早'; };

const STATUS = {
  accepted_local: { text:'通过', cls:'ok' },
  blocked: { text:'卡住', cls:'fail' },
  running: { text:'进行中', cls:'run' },
  ready: { text:'未开始', cls:'idle' },
  cancelled: { text:'已取消', cls:'idle' },
};
const statusOf = s => STATUS[s] || { text:s, cls:'idle' };

let TASKS = [], CUR = null, TASK = null, CONTRACT = null, ROLES = {}, LIMITS = null;
let FILTER = 'all';

/* ---------- 主题 ---------- */
const media = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(pref){
  const dark = pref === 'dark' || (pref === 'system' && media.matches);
  document.documentElement.dataset.mode = dark ? 'dark' : 'light';
  document.documentElement.dataset.pref = pref;
  document.querySelectorAll('#themeSwitch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === pref)));
  try { localStorage.setItem('pdw-viewer-theme', pref); } catch (e) {}
}
$('#themeSwitch').querySelectorAll('button').forEach(b => b.onclick = () => applyTheme(b.dataset.mode));
media.addEventListener('change', () => { if (document.documentElement.dataset.pref === 'system') applyTheme('system'); });
applyTheme(document.documentElement.dataset.pref || 'system');

async function api(u){ const r = await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error(r.status); return r.json(); }

/* ---------- 模型 ---------- */
function modelShort(role){
  const cfg = ROLES[role] || {};
  const a = (TASK.attempts||[]).filter(x => role==='implement' ? (x.role==='implement'||x.role==='repair') : x.role===role);
  const last = a[a.length-1];
  return { backend:last?.backend || cfg.backend || '', model:(last?.model || cfg.model || '').split('/').pop().replace(/^deepseek-/,''),
    effort:last?.effort ?? cfg.effort ?? null, last, list:a };
}
function modelFull(role){
  const m = modelShort(role);
  return `${m.backend} · ${(m.last?.model || ROLES[role]?.model || '未配置')}${m.effort ? ' · ' + m.effort : ''}`;
}

/* ---------- 侧栏 ---------- */
function renderFilters(){
  $('#cAll').textContent = TASKS.length;
  $('#cRun').textContent = TASKS.filter(t=>t.status==='running').length;
  $('#cBad').textContent = TASKS.filter(t=>t.status==='blocked').length;
  document.querySelectorAll('#filters button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === FILTER)));
}
function visibleTasks(){
  const rank = t => t.status === 'running' ? 0 : t.status === 'blocked' ? 1 : t.status === 'cancelled' ? 3 : 2;
  let list = TASKS;
  if (FILTER === 'running') list = TASKS.filter(t=>t.status==='running');
  else if (FILTER === 'blocked') list = TASKS.filter(t=>t.status==='blocked');
  return list.slice().sort((a,b) => rank(a) - rank(b) || String(b.updated_at ?? '').localeCompare(String(a.updated_at ?? '')));
}
function renderList(){
  renderFilters();
  const list = visibleTasks();
  if (!list.length){
    $('#tasks').innerHTML = `<div class="note" style="padding:10px">${FILTER==='all'?'还没有任务。':'这一类现在没有任务。'}</div>`;
    return;
  }
  let html = '', group = null;
  for (const t of list){
    const g = dayKey(t.updated_at);
    if (g !== group){ html += `<div class="group">${g}</div>`; group = g; }
    const s = statusOf(t.status);
    const goal = (t.goal || '').replace(/\s+/g,' ');
    const short = goal.length > 22 ? goal.slice(0,22) + '…' : (goal || '（没有目标）');
    html += `<div class="item ${CUR===t.id?'on':''}" data-id="${esc(t.id)}">
      <div class="l1"><span class="pill ${s.cls}">${s.text}</span><span class="goal" title="${esc(goal)}">${esc(short)}</span></div>
      <div class="l2"><span>${t.calls_used} 次调用</span><span>${ago(t.updated_at)}</span><span class="time">${clock(t.created_at)}</span></div>
    </div>`;
  }
  $('#tasks').innerHTML = html;
  $('#tasks').querySelectorAll('.item').forEach(el => el.onclick = () => open(el.dataset.id));
}
document.querySelectorAll('#filters button').forEach(b => b.onclick = () => { FILTER = b.dataset.f; renderList(); });

/* ---------- 进度 ---------- */
const STEPS = [
  { role:'contract', title:'定契约' },
  { role:'scan', title:'摸底' },
  { role:'test-plan', title:'验收计划' },
  { role:'implement', title:'实现' },
  { role:'checks', title:'验收' },
  { role:'review', title:'复核' },
  { role:'final', title:'收尾' },
];
const TIMED = ['scan','test-plan','implement','review'];

function roleState(role){
  const m = modelShort(role);
  const running = m.list.find(x=>x.status==='running');
  if (running) return { cls:'run', text:'进行中', span:{ start:running.started_at, end:null } };
  if (m.list.some(x=>x.status==='completed')){
    return { cls:'ok', text:'完成', span:{ start:m.list[0].started_at, end:m.list[m.list.length-1].finished_at } };
  }
  if (m.list.length) return { cls:'fail', text:'失败', span:{ start:m.list[0].started_at, end:m.list[m.list.length-1].finished_at } };
  return { cls:'idle', text:'未开始', span:null };
}

function stepRow(s){
  let cls, text, who, span = null;
  if (s.role === 'contract'){ cls='ok'; text='已定'; who='你（当前会话）'; }
  else if (s.role === 'final'){
    const map = { accepted_local:['ok','通过'], blocked:['fail','卡在这里'], running:['run','进行中'], cancelled:['idle','已取消'] };
    const [c,t] = map[TASK.status] || ['idle','未开始'];
    cls=c; text=t; who='PDW 判定';
  }
  else if (s.role === 'checks'){
    const c = TASK.checks || [], pass = c.filter(x=>x.exit_code===0).length;
    cls = c.length ? (pass===c.length?'ok':'fail') : 'idle';
    text = c.length ? `${pass}/${c.length} 通过` : '未开始';
    who = `PDW 直跑 · ${c.length} 条命令`;
  }
  else {
    const st = roleState(s.role), m = modelShort(s.role);
    cls = st.cls; text = st.text; span = st.span;
    who = st.cls==='idle' ? `${m.backend} · ${m.model}（未跑）` : `${m.backend} · ${m.model} · ${m.effort ?? '默认'}`;
  }
  const dur = span ? fmt(new Date(span.end || Date.now()) - new Date(span.start)) : '';
  return `<div class="step ${cls}" data-step="${s.role}">
    <div class="title">${s.title}</div>
    <div class="who" title="${esc(modelFull(s.role))}">${esc(who)}</div>
    <div class="dur">${dur}</div>
    <div class="st"><span class="pill ${cls}">${text}</span></div>
  </div>`;
}

/* 一条总带：谁占了多少时间、谁和谁并行 */
function timeline(){
  const total = TASK.elapsed_ms || 0;
  if (!total) return '';
  const segs = [];
  for (const role of TIMED){
    const st = roleState(role);
    if (!st.span) continue;
    const start = Math.max(0, new Date(st.span.start) - new Date(TASK.created_at));
    const end = st.span.end ? new Date(st.span.end) - new Date(TASK.created_at) : total;
    segs.push({ role, cls: st.cls, start, end, dur: end - start,
      left: Math.min(100, start / total * 100),
      width: Math.max(1.2, Math.min(100 - start/total*100, (end - start) / total * 100)) });
  }
  if (!segs.length) return '';
  const bars = segs.map(s=>`<i class="${s.cls}" style="left:${s.left}%;width:${s.width}%" title="${s.role} · ${fmt(s.dur)}"></i>`).join('');
  const label = { scan:'摸底', 'test-plan':'验收计划', implement:'实现', review:'复核' };
  const longest = segs.slice().sort((a,b)=>b.dur-a.dur)[0];
  const pct = Math.round(longest.dur / total * 100);
  const scan = segs.find(s=>s.role==='scan'), plan = segs.find(s=>s.role==='test-plan');
  const parallel = scan && plan && scan.start < plan.end && plan.start < scan.end;
  return `<div class="timeline">${bars}</div>
    <div class="tl-caption">最长的是「${label[longest.role]}」${fmt(longest.dur)}，占 ${pct}%${parallel?'；摸底与验收计划是同时跑的':''}</div>`;
}

/* ---------- hero ---------- */
function hero(){
  const st = statusOf(TASK.status);
  if (TASK.status === 'running'){
    const idx = STEPS.findIndex(x=>x.role===TASK.phase);
    const name = idx >= 0 ? STEPS[idx].title : (TASK.phase || '执行');
    const m = idx >= 0 && TIMED.includes(TASK.phase) ? modelShort(TASK.phase) : null;
    const run = m?.list.find(x=>x.status==='running');
    const silent = run && run.silence_seconds > 480;
    return `<div class="hero run">正在第 ${idx + 1} 步 · ${esc(name)}</div>
      <div class="hero-sub">${m ? `<code>${esc(m.backend)} · ${esc(m.model)} · ${esc(m.effort ?? '默认')}</code> · ` : ''}已跑 ${fmt(run ? Date.now() - new Date(run.started_at) : TASK.elapsed_ms)}</div>
      ${silent ? `<div class="hero-warn">⚠ 已经 ${fmt(run.silence_seconds * 1000)} 没有新输出</div>` : ''}`;
  }
  if (TASK.status === 'blocked'){
    return `<div class="hero fail" title="${esc(TASK.failure || '')}">卡住 · ${esc((TASK.failure || '没有记录原因').slice(0,80))}</div>`;
  }
  if (TASK.status === 'accepted_local'){
    const c = TASK.checks || [], pass = c.filter(x=>x.exit_code===0).length;
    return `<div class="hero ok">通过 · 验收 ${pass}/${c.length} · ${(TASK.changed||[]).length} 个文件改动 · 用时 ${fmt(TASK.elapsed_ms)}</div>`;
  }
  if (TASK.status === 'cancelled') return `<div class="hero idle">已取消 · ${fmt(TASK.elapsed_ms)}</div>`;
  return `<div class="hero idle">还没开始跑</div>`;
}

/* ---------- 右侧 ---------- */
function renderTask(){
  if (!TASK) return;
  const sc = $('#detail').scrollTop;
  const checks = TASK.checks || [], attempts = TASK.attempts || [], changed = TASK.changed || [], c = CONTRACT;
  $('#topTitle').textContent = TASK.id;

  $('#detail').innerHTML = `
    <div class="panel card">
      ${hero()}
      <div class="meta">${clock(TASK.created_at)} 起 · 调用 ${TASK.calls_used}/${LIMITS?.max_cli_calls ?? '?'} · 返工 ${TASK.repairs_used}/${LIMITS?.max_repairs ?? '?'}</div>
      ${c ? `<div class="goal" id="goalBox"><b>目标</b>${esc(c.goal)}</div>` : ''}
    </div>

    <div class="panel card">
      <h3 class="sec">进度 <span class="count">共 7 步；只有「实现」能改代码</span>
        <span class="legend">点任意一行看原文</span></h3>
      ${timeline()}
      <div class="steps">${STEPS.map(stepRow).join('')}</div>
    </div>

    <div class="panel card">
      <h3 class="sec">明细 <span class="count">判定来自退出码与复核，不是模型自述</span></h3>

      <details ${checks.length && !checks.every(x=>x.exit_code===0) ? 'open' : ''}>
        <summary>验收结果<span class="count">${checks.length ? checks.filter(x=>x.exit_code===0).length + '/' + checks.length + ' 通过' : '还没跑'}</span></summary>
        <div class="body">${checks.length ? `<table><thead><tr><th>检查</th><th>命令</th><th>结果</th></tr></thead><tbody>
          ${checks.map((x,i)=>`<tr data-check="${i}"><td>${esc(x.id)}</td><td class="mono dim">${esc((x.command+' '+(x.args||[]).join(' ')).slice(0,92))}</td>
          <td>${x.exit_code===0?'<span class="pill ok">通过</span>':'<span class="pill fail">失败 '+x.exit_code+'</span>'}</td></tr>`).join('')}
        </tbody></table>` : '<div class="note">还没跑验收。</div>'}</div>
      </details>

      <details>
        <summary>动作记录<span class="count">${attempts.length} 次派发</span></summary>
        <div class="body">${attempts.length ? `<table><thead><tr><th>开始</th><th>谁</th><th>模型 / 深度</th><th>用时</th><th>结果</th></tr></thead><tbody>
          ${attempts.map((a,i)=>`<tr data-attempt="${i}"><td class="mono">${clock(a.started_at)}</td><td>${esc(a.role)}</td>
          <td class="mono dim">${esc(a.model.split('/').pop())}${a.effort?' · '+esc(a.effort):''}</td>
          <td class="mono">${a.finished_at?fmt(new Date(a.finished_at)-new Date(a.started_at)):'—'}</td>
          <td>${a.status==='completed'?'<span class="pill ok">成功</span>':a.status==='failed'?'<span class="pill fail">失败 '+ (a.exit_code??'?') +'</span>':'<span class="pill idle">'+esc(a.status)+'</span>'}</td></tr>`).join('')}
        </tbody></table>` : '<div class="note">还没派发过。</div>'}</div>
      </details>

      <details>
        <summary>改动文件<span class="count">${changed.length} 个</span></summary>
        <div class="body">${changed.length ? `<pre style="max-height:240px">${esc(changed.join('\n'))}</pre>` : '<div class="note">没有记录改动文件。</div>'}</div>
      </details>

      ${c ? `<details>
        <summary>范围与要求<span class="count">${c.scope.length} 条范围 · ${c.acceptance.length} 条验收</span></summary>
        <div class="body">
          <div class="chips">${c.acceptance.map(a=>`<span title="${esc(a.statement||'')}">${esc(a.id)}</span>`).join('')}</div>
          <div class="note" style="margin:6px 0 6px">允许改动的路径：</div>
          <pre style="max-height:160px">${esc(c.scope.join('\n'))}</pre>
          ${c.baseline_dirty.length?`<div class="note" style="margin-top:8px">开工前已有 ${c.baseline_dirty.length} 个未提交文件，不算越界。</div>`:''}
        </div>
      </details>` : ''}

      <div style="margin:10px 6px 4px"><button class="ghost" id="reportBtn">看交付报告</button></div>
    </div>
  `;

  $('#detail').querySelectorAll('.step').forEach(el => el.onclick = () => showStep(el.dataset.step));
  $('#detail').querySelectorAll('tr[data-attempt]').forEach(el => el.onclick = () => showAttempt(+el.dataset.attempt));
  $('#detail').querySelectorAll('tr[data-check]').forEach(el => el.onclick = () => showCheck(+el.dataset.check));
  const g = $('#goalBox'); if (g) g.onclick = () => g.classList.toggle('open');
  const rb = $('#reportBtn'); if (rb) rb.onclick = showReport;
  $('#detail').scrollTop = sc;
}

/* ---------- 抽屉 ---------- */
function drawer(title, sub, body){
  $('#drawerTitle').textContent = title;
  $('#drawerSub').textContent = sub || '';
  $('#drawerBody').textContent = body ?? '—';
  $('#drawer').classList.add('open');
}
async function loadLog(path, title, sub){
  drawer(title, sub, '读取中…');
  try{ const r = await api('/api/log?path='+encodeURIComponent(path)+'&tail=300'); drawer(title, sub, r.error ? `（${r.error}）` : r.text); }
  catch{ drawer(title, sub, '（读不到日志）'); }
}
function showStep(role){
  if (role === 'contract'){ drawer('契约', '冻结后不能改', JSON.stringify(CONTRACT, null, 2)); return; }
  if (role === 'final'){ drawer('收尾', '', `状态：${TASK.status}\n产物指纹：${TASK.artifact}\n${TASK.failure?'停下原因：'+TASK.failure:''}`); return; }
  if (role === 'checks'){
    drawer('验收命令', '', (TASK.checks||[]).map(x=>`# ${x.id}\n$ ${x.command} ${(x.args||[]).join(' ')}\n→ 退出码 ${x.exit_code}${x.stderr?('\nstderr: '+x.stderr.split('\n').slice(-3).join('\n')):''}`).join('\n\n') || '还没跑。');
    return;
  }
  const m = modelShort(role);
  if (!m.last){ drawer(role, '还没跑过', `这一步没有执行过。它配的是：${modelFull(role)}\n跑起来时用这一组设置。`); return; }
  loadLog(m.last.prompt, `${role} 的提示词`, modelFull(role));
}
function showAttempt(i){
  const a = TASK.attempts[i]; if (!a) return;
  loadLog(a.stdout, `${a.role} 的输出`, `退出码 ${a.exit_code ?? '—'} · ${a.model.split('/').pop()}`);
}
function showCheck(i){
  const c = TASK.checks[i]; if (!c) return;
  loadLog(c.stdout, `验收：${c.id}`, `退出码 ${c.exit_code}`);
}
async function showReport(){
  drawer('交付报告', TASK.id, '读取中…');
  try{ const r = await api('/api/report?id='+encodeURIComponent(TASK.id)); drawer('交付报告', TASK.id, r.text || '（空）'); }
  catch{ drawer('交付报告', TASK.id, '还没有报告。'); }
}
$('#drawerClose').onclick = () => $('#drawer').classList.remove('open');
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#drawer').classList.remove('open'); });

/* ---------- Codex 额度 ---------- */
function resetAt(epochSec){
  if (!epochSec) return '—';
  const d = new Date(epochSec * 1000), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toTimeString().slice(0,5);
  if ((d - now) / 86400000 < 1) return '明天 ' + d.toTimeString().slice(0,5);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function winLabel(min){
  if (!min) return '—';
  if (min <= 360) return Math.round(min / 60) + ' 小时';
  if (min <= 20160) return '1 周';
  return Math.round(min / 1440) + ' 天';
}
function quotaRow(label, w){
  const remain = Math.max(0, Math.min(100, Math.round(100 - (w.used_percent ?? 0))));
  const cls = remain <= 10 ? 'full' : remain <= 25 ? 'warn' : '';
  return `<div class="qrow"><span class="k">${label}</span><div class="qbar ${cls}"><i style="width:${remain}%"></i></div><span class="v">${remain}%</span></div>
    <div class="qnote">${resetAt(w.resets_at)} 重置</div>`;
}
async function loadQuota(){
  try{
    const q = await api('/api/codex-usage');
    const box = $('#quota');
    if (!q.available){
      box.innerHTML = `<div class="qh">Codex 剩余用量 <span>本地记录</span></div><div class="qfoot">${esc(q.reason || '读不到')}</div>`;
      return;
    }
    const parts = [];
    if (q.primary) parts.push(quotaRow(winLabel(q.primary.window_minutes), q.primary));
    if (q.secondary) parts.push(quotaRow(winLabel(q.secondary.window_minutes), q.secondary));
    const ctx = q.context_window ? Math.round(q.context_window / 1000) + 'k' : '—';
    const tok = q.total_tokens ? (q.total_tokens / 1000).toFixed(0) + 'k' : '—';
    const credits = q.credits ? (q.credits.unlimited ? '不限' : (q.credits.balance ?? '0')) : '—';
    box.innerHTML = `<div class="qh">Codex 剩余用量 <span>${q.captured_at ? ago(q.captured_at) : '本地记录'}</span></div>
      ${parts.join('')}
      <div class="qfoot">积分 ${esc(credits)} · 上下文 ${ctx} · 本会话 ${tok} tokens</div>`;
  }catch{
    $('#quota').innerHTML = '<div class="qh">Codex 剩余用量 <span>本地记录</span></div><div class="qfoot">读不到用量</div>';
  }
}

/* ---------- 加载 ---------- */
async function loadProject(){
  try{ const p = await api('/api/project'); $('#projectName').textContent = p.name; $('#projectPath').textContent = p.project; }catch{}
}
async function loadTasks(){
  const d = await api('/api/tasks');
  TASKS = d.tasks;
  renderList();
  if (!CUR && TASKS.length){
    const wanted = fromHash();
    const pick = wanted && TASKS.some(t=>t.id===wanted) ? wanted
      : (TASKS.find(t=>t.status==='running') || TASKS[0]).id;
    await open(pick);
  }
}
function fromHash(){
  const m = /^#\/([a-z0-9][a-z0-9-]{0,79})$/.exec(location.hash);
  return m ? m[1] : new URLSearchParams(location.search).get('t');
}
async function open(id){
  CUR = id;
  if (location.hash !== '#/'+id) history.replaceState(null,'','#/'+id);
  renderList();
  await refreshTask();
}
async function refreshTask(){
  if (!CUR) return;
  try{
    const d = await api('/api/task?id='+encodeURIComponent(CUR));
    TASK = d.task; CONTRACT = d.contract; ROLES = d.roles || {}; LIMITS = d.limits || TASK.limits;
    renderTask();
  }catch{ $('#detail').innerHTML = '<div class="panel card note">读不到这个任务。</div>'; }
}
async function tick(){
  try{ $('#live').classList.remove('off'); await loadTasks(); await refreshTask(); await loadQuota(); }
  catch{ $('#live').classList.add('off'); }
}
window.addEventListener('hashchange', () => { const id = fromHash(); if (id && id !== CUR) open(id); });
loadProject(); tick(); setInterval(tick, 2500);
