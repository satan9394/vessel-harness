<!DOCTYPE html>
<html lang="zh-CN" style="color-scheme: light dark" data-theme="light" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vessel 原型 · 方向三「工业终端」</title>
<style>
/*
  Vessel Web 原型 —— 方向三：工业终端 / 高对比风
  等宽字体、直线边框、方格与括号记号、大写标签；圆角近乎为零；瞬时时序。
*/

/* ---------- tokens: light（"印刷终端"） ---------- */
:root{
  --bg:#f2f2ec; --panel:#fbfbf6; --surface:#e9e9e0; --surface-2:#dfdfd4; --rail:#e9e9e0;
  --line:#c7c7b8; --line-strong:#8f9080; --line-focus:#0b7285;
  --text:#111309; --text-2:#4a4d3e; --text-3:#7c7f6e;
  --accent:#0b6f85; --accent-ink:#fbfbf6; --accent-soft:rgba(11,111,133,.12);
  --ok:#166b34; --warn:#8a5a00; --danger:#a8201a;
  --ok-soft:rgba(22,107,52,.13); --warn-soft:rgba(138,90,0,.14); --danger-soft:rgba(168,32,26,.12);
  --sel:rgba(11,111,133,.2);
}
/* ---------- tokens: dark ---------- */
:root[data-theme="dark"]{
  --bg:#05070a; --panel:#0a0e13; --surface:#0d1319; --surface-2:#121a22; --rail:#080c11;
  --line:#1d2833; --line-strong:#33475a; --line-focus:#39d0d8;
  --text:#d7e3ee; --text-2:#8fa5b8; --text-3:#5d7385;
  --accent:#39d0d8; --accent-ink:#04191b; --accent-soft:rgba(57,208,216,.13);
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171;
  --ok-soft:rgba(74,222,128,.12); --warn-soft:rgba(251,191,36,.12); --danger-soft:rgba(248,113,113,.12);
  --sel:rgba(57,208,216,.25);
}
:root{
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r1:0px; --r2:2px; --r3:2px;
  --fs-10:10px; --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-15:15px; --fs-19:19px; --fs-24:24px;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace;
  --dur:60ms;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:var(--fs-12);line-height:1.6;
  -webkit-font-smoothing:antialiased;font-variant-ligatures:none}
::selection{background:var(--sel)}

.reviewbar{position:sticky;top:0;z-index:99;display:flex;gap:var(--s4);align-items:center;flex-wrap:wrap;
  padding:8px var(--s4);background:var(--surface-2);border-bottom:1px dashed var(--line-strong);font-size:var(--fs-11);color:var(--text-2)}
.reviewbar b{color:var(--text)}
.reviewbar .grp{display:flex;align-items:center;gap:6px}
.reviewbar .grp>span{color:var(--text-3)}
.rbtn{padding:3px 9px;border:1px solid var(--line-strong);background:transparent;color:var(--text-2);font:inherit;font-size:var(--fs-11);cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.rbtn:hover{border-color:var(--text-3);color:var(--text)}
.rbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.reviewbar .note{margin-left:auto;color:var(--text-3)}

.board{padding:var(--s6) var(--s4) var(--s7);max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s6)}
.frame{display:flex;flex-direction:column;gap:var(--s2);margin:0}
.frame>figcaption{display:flex;align-items:baseline;gap:var(--s3)}
.frame>figcaption .idx{color:var(--accent);font-size:var(--fs-11);letter-spacing:.1em}
.frame>figcaption h2{margin:0;font-size:var(--fs-15);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.frame>figcaption p{margin:0;color:var(--text-3);font-size:var(--fs-11)}
.canvas{border:1px solid var(--line-strong);background:var(--bg)}

/* shell */
.app{display:grid;grid-template-columns:236px 1fr;min-height:520px}
body.vp800 .app{grid-template-columns:40px 1fr}
body.vp800 .railtext{display:none}
body.vp800 .conv-cols{grid-template-columns:1fr}
body.vp800 .inspector{display:none}
body.vp800 .recent{grid-template-columns:1fr}
/* 真实实现中 ≤800px 为无障碍抽屉；原型以图标栏代表折叠形态 */
@media (max-width:800px){
  .app{grid-template-columns:40px 1fr}
  .railtext{display:none}
  .conv-cols{grid-template-columns:1fr}
  .inspector{display:none}
  .recent{grid-template-columns:1fr}
}

/* rail */
.rail{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s3);background:var(--rail);border-right:1px solid var(--line-strong)}
.brand{display:flex;align-items:center;gap:8px;padding:2px 6px var(--s3);border-bottom:1px solid var(--line);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.brand .mark{width:20px;height:20px;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:800}
.brand .sub{margin-left:auto;font-size:var(--fs-10);color:var(--text-3);letter-spacing:0}
.areas{display:flex;flex-direction:column}
.area{display:flex;align-items:center;gap:9px;padding:6px 8px;color:var(--text-2);cursor:pointer;border:0;background:transparent;font:inherit;font-size:var(--fs-12);text-align:left;border-left:2px solid transparent}
.area:hover{background:var(--surface);color:var(--text)}
.area[aria-current="page"]{background:var(--surface);color:var(--accent);border-left-color:var(--accent);font-weight:700}
.area .ico{width:14px;text-align:center;opacity:.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:6px 12px;border-radius:var(--r1);
  border:1px solid var(--line-strong);background:var(--panel);color:var(--text);font:inherit;font-size:var(--fs-12);
  text-transform:uppercase;letter-spacing:.05em;cursor:pointer;white-space:nowrap;transition:background var(--dur) linear,color var(--dur) linear}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 85%,#000)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface);color:var(--text)}
.btn-danger{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn-sm{padding:3px 8px;font-size:var(--fs-10)}
.newbtn{width:100%}
.grp{display:flex;flex-direction:column}
.grp>.lbl{padding:var(--s3) 8px 4px;font-size:var(--fs-10);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:8px;padding:5px 8px;color:var(--text-2);cursor:pointer;border-left:2px solid transparent}
.item:hover{background:var(--surface);color:var(--text)}
.item[aria-current="true"]{background:var(--surface);color:var(--text);border-left-color:var(--text-3)}
.item .dot{width:6px;height:6px;flex:none;border:1px solid var(--text-3)}
.item .dot.live{background:var(--ok);border-color:var(--ok)}
.item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .when{font-size:var(--fs-10);color:var(--text-3)}
.search{padding:6px 8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:var(--fs-11);width:100%}
.search::placeholder,.ta::placeholder{color:var(--text-3)}
.search:focus,.ta:focus{outline:1px solid var(--line-focus);outline-offset:0;border-color:var(--line-focus)}
.rail-foot{margin-top:auto;padding:var(--s3) 8px 0;border-top:1px solid var(--line);font-size:var(--fs-10);color:var(--text-3);line-height:1.9}

/* main */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:var(--s3);padding:8px var(--s4);border-bottom:1px solid var(--line-strong);background:var(--panel)}
.status{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:var(--fs-11)}
.status .led{width:7px;height:7px;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.kbd{font-size:var(--fs-10);padding:1px 5px;border:1px solid var(--line-strong);color:var(--text-3)}
.body{padding:var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s5);min-width:0}
h1.title{margin:0 0 4px;font-size:var(--fs-24);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.lede{margin:0;color:var(--text-2);max-width:74ch}

.composer{border:1px solid var(--line-strong);background:var(--panel);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s3)}
.pills{display:flex;gap:var(--s2);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line);color:var(--text-2);font-size:var(--fs-11);cursor:pointer}
.pill:hover{border-color:var(--line-strong);color:var(--text)}
.pill .k{color:var(--text-3);text-transform:uppercase;font-size:var(--fs-10);letter-spacing:.08em}
.pill.accent{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ta{min-height:74px;padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:var(--fs-12);resize:none;width:100%}
.composer-foot{display:flex;align-items:center;gap:var(--s2)}
.composer-foot .hint{margin-left:auto;color:var(--text-3);font-size:var(--fs-10)}

.section-label{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:2px;border-bottom:1px solid var(--line);padding-bottom:4px}
.section-label h2{margin:0;font-size:var(--fs-12);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.section-label span{color:var(--text-3);font-size:var(--fs-10)}
.recent{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.mini{border:1px solid var(--line);background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.mini:hover{border-color:var(--line-strong)}
.mini .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .m{color:var(--text-3);font-size:var(--fs-10)}
.mini .s{display:flex;gap:6px;align-items:center;font-size:var(--fs-10);color:var(--text-3)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 6px;font-size:var(--fs-10);font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor}
.badge.ok{color:var(--ok);background:var(--ok-soft)}
.badge.warn{color:var(--warn);background:var(--warn-soft)}
.badge.danger{color:var(--danger);background:var(--danger-soft)}
.badge.info{color:var(--accent);background:var(--accent-soft)}
.badge.mute{color:var(--text-2);background:var(--surface-2)}

/* conversation */
.conv-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-strong);background:var(--panel)}
.conv-head .ttl{font-weight:700}
.conv-head .meta{color:var(--text-3);font-size:var(--fs-11);display:flex;gap:var(--s2);align-items:center}
.conv-head .acts{margin-left:auto;display:flex;gap:6px}
.conv-cols{display:grid;grid-template-columns:1fr 320px;min-height:440px}
.stream{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.msg{display:flex;gap:var(--s3);max-width:80ch}
.avatar{width:22px;height:22px;flex:none;display:grid;place-items:center;border:1px solid var(--line-strong);font-size:var(--fs-10);font-weight:700}
.avatar.u{color:var(--text-2)}
.avatar.a{color:var(--accent);border-color:var(--accent)}
.msg .role{font-size:var(--fs-10);color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px}
.msg p{margin:0 0 6px}
.msg p:last-child{margin-bottom:0}
.think{border-left:2px solid var(--line-strong);padding:4px 0 4px 10px;margin:6px 0;color:var(--text-2)}
.think summary{cursor:pointer;color:var(--text-3);font-size:var(--fs-11)}
.tool{display:flex;align-items:center;gap:var(--s2);padding:7px 10px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-size:var(--fs-11)}
.tool .name{color:var(--accent);font-weight:700;text-transform:uppercase}
.tool .st{margin-left:auto;display:flex;gap:10px;color:var(--text-3);font-size:var(--fs-10)}
.approval{border:1px solid var(--warn);background:var(--warn-soft);padding:10px var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.approval .hd{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.08em}
.approval .op{font-size:var(--fs-11);color:var(--text-2)}
.approval .row{display:flex;gap:8px}
.usage{display:flex;gap:var(--s4);padding:8px var(--s4);border-top:1px solid var(--line-strong);color:var(--text-3);font-size:var(--fs-10);background:var(--panel)}
.usage b{color:var(--text-2)}
.composer-input{display:flex;gap:var(--s2);align-items:flex-end;padding:var(--s3) var(--s4);border-top:1px solid var(--line-strong)}

.inspector{border-left:1px solid var(--line-strong);background:var(--panel);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line-strong);overflow-x:auto}
.tab{padding:9px 10px;border:0;background:transparent;color:var(--text-3);font:inherit;font-size:var(--fs-11);
  text-transform:uppercase;letter-spacing:.08em;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text-2)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.insp-body{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s4);overflow:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px var(--s3);font-size:var(--fs-11);margin:0}
.kv dt{color:var(--text-3);text-transform:uppercase;font-size:var(--fs-10);letter-spacing:.06em}
.kv dd{margin:0;overflow-wrap:anywhere}
.filelist{display:flex;flex-direction:column}
.file{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid var(--line);font-size:var(--fs-11);color:var(--text-2)}
.file .add{color:var(--ok)} .file .del{color:var(--danger)} .file .tags{margin-left:auto;display:flex;gap:6px;font-size:var(--fs-10)}

/* fragments */
.frag{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s4);padding:var(--s4)}
.frag .box{border:1px solid var(--line);padding:var(--s3);background:var(--panel);display:flex;flex-direction:column;gap:var(--s3)}
.frag .box>h3{margin:0;font-size:var(--fs-10);text-transform:uppercase;letter-spacing:.14em;color:var(--text-3);border-bottom:1px solid var(--line);padding-bottom:4px}
.rowbtns{display:flex;gap:var(--s2);flex-wrap:wrap}
table.grid{width:100%;border-collapse:collapse;font-size:var(--fs-11)}
table.grid th{text-align:left;color:var(--text-3);font-weight:700;font-size:var(--fs-10);text-transform:uppercase;letter-spacing:.1em;padding:5px 6px;border-bottom:1px solid var(--line-strong)}
table.grid td{padding:6px;border-bottom:1px solid var(--line);color:var(--text-2)}
table.grid tr:last-child td{border-bottom:0}
.empty{border:1px dashed var(--line-strong);padding:var(--s4);text-align:center;color:var(--text-3)}
.empty .big{font-size:var(--fs-19);margin-bottom:4px;color:var(--accent)}
.toast{border:1px solid var(--line-strong);border-left:3px solid var(--accent);background:var(--panel);padding:9px var(--s3);display:flex;gap:10px;align-items:flex-start}
.toast .x{margin-left:auto;color:var(--text-3);cursor:pointer}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.sw{width:44px;height:30px;border:1px solid var(--line);display:grid;place-items:end center;font-size:9px;color:var(--text-3);padding-bottom:2px}
.typerow{display:flex;align-items:baseline;gap:var(--s3);padding:5px 0;border-bottom:1px solid var(--line)}
.typerow:last-child{border-bottom:0}
.typerow code{font-size:var(--fs-10);color:var(--text-3);width:58px;flex:none}
</style>
</head>
<body>

<div class="reviewbar">
  <b>方向三 · 工业终端</b>
  <div class="grp"><span>主题</span>
    <button class="rbtn" data-theme-btn="auto" aria-pressed="true">AUTO</button>
    <button class="rbtn" data-theme-btn="light" aria-pressed="false">LIGHT</button>
    <button class="rbtn" data-theme-btn="dark" aria-pressed="false">DARK</button>
  </div>
  <div class="grp"><span>语言</span>
    <button class="rbtn" data-lang-btn="zh" aria-pressed="true">中</button>
    <button class="rbtn" data-lang-btn="en" aria-pressed="false">EN</button>
  </div>
  <div class="grp"><span>视口</span>
    <button class="rbtn" data-vp-btn="desktop" aria-pressed="true">桌面</button>
    <button class="rbtn" data-vp-btn="800" aria-pressed="false">800px</button>
  </div>
  <span class="note">评审工具条 · 不属于产品 UI</span>
</div>

<div class="board">

  <!-- FRAME A -->
  <figure class="frame">
    <figcaption><span class="idx">[A]</span><h2 data-zh="工作台首页" data-en="Workbench home">工作台首页</h2><p data-zh="等宽、方格、大写标签" data-en="Monospace, grid, uppercase labels">等宽、方格、大写标签</p></figcaption>
    <div class="canvas">
      <div class="app">
        <aside class="rail">
          <div class="brand"><span class="mark">V</span><span class="railtext">VESSEL</span><span class="sub railtext">v0.10.0</span></div>
          <nav class="areas">
            <button class="area" aria-current="page"><span class="ico">▤</span><span class="railtext" data-zh="工作台" data-en="WORKBENCH">工作台</span></button>
            <button class="area"><span class="ico">◔</span><span class="railtext" data-zh="活动" data-en="ACTIVITY">活动</span></button>
            <button class="area"><span class="ico">❖</span><span class="railtext" data-zh="AGENT STUDIO" data-en="AGENT STUDIO">AGENT STUDIO</span></button>
            <button class="area"><span class="ico">⚙</span><span class="railtext" data-zh="设置" data-en="SETTINGS">设置</span></button>
          </nav>
          <button class="btn btn-primary newbtn">＋ <span class="railtext" data-zh="新建会话" data-en="NEW SESSION">新建会话</span></button>
          <div class="grp">
            <div class="lbl"><span class="railtext" data-zh="项目" data-en="PROJECTS">项目</span></div>
            <div class="item" aria-current="true"><span class="dot"></span><span class="name railtext">vessel-harness</span></div>
            <div class="item"><span class="dot"></span><span class="name railtext">second-repo</span></div>
          </div>
          <div class="grp">
            <div class="lbl"><span class="railtext" data-zh="历史会话" data-en="SESSIONS">历史会话</span></div>
            <input class="search railtext" placeholder="搜索会话…" data-ph-zh="搜索会话…" data-ph-en="Search sessions…">
            <div class="item"><span class="dot live"></span><span class="name railtext" data-zh="重构 Provider 能力协商" data-en="Refactor provider negotiation">重构 Provider 能力协商</span><span class="when railtext">14:03</span></div>
            <div class="item"><span class="dot"></span><span class="name railtext" data-zh="画布单 Hunk 补丁选择器" data-en="Canvas single-hunk picker">画布单 Hunk 补丁选择器</span><span class="when railtext" data-zh="昨天" data-en="yesterday">昨天</span></div>
            <div class="item"><span class="dot"></span><span class="name railtext" data-zh="检查 sandbox 逃逸路径" data-en="Audit sandbox escapes">检查 sandbox 逃逸路径</span><span class="when railtext">10-12</span></div>
          </div>
          <div class="rail-foot railtext" data-zh="项目 &gt; 会话 &gt; 运行 &gt; 子代理" data-en="Project &gt; Session &gt; Run &gt; Subagents">项目 &gt; 会话 &gt; 运行 &gt; 子代理</div>
        </aside>
        <div class="main">
          <header class="topbar">
            <div class="status"><span class="led"></span><span data-zh="本地服务运行正常" data-en="LOCAL SERVER HEALTHY">本地服务运行正常</span><span style="color:var(--text-3)">· V0.10.0</span></div>
            <div class="top-actions"><button class="btn btn-ghost btn-sm"><span class="kbd">CTRL</span><span class="kbd">K</span><span data-zh="命令" data-en="COMMAND">命令</span></button><button class="btn btn-ghost btn-sm" data-zh="偏好设置" data-en="PREFERENCES">偏好设置</button></div>
          </header>
          <div class="body">

<script>
(function(){
  var root=document.documentElement, mq=window.matchMedia('(prefers-color-scheme: dark)'), choice='auto';
  function resolve(){ root.setAttribute('data-theme', choice==='auto'?(mq.matches?'dark':'light'):choice); }
  var hm=/(?:^|[#&?])theme=(dark|light)/.exec(location.search+location.hash);
  if(hm) choice=hm[1];
  mq.addEventListener('change',resolve); resolve();
  function press(sel,attr,val){ document.querySelectorAll(sel).forEach(function(b){ b.setAttribute('aria-pressed',String(b.getAttribute(attr)===val)); }); }
  press('[data-theme-btn]','data-theme-btn',choice);
  document.querySelectorAll('[data-theme-btn]').forEach(function(b){ b.addEventListener('click',function(){ choice=b.getAttribute('data-theme-btn'); resolve(); press('[data-theme-btn]','data-theme-btn',choice); }); });
  document.querySelectorAll('[data-lang-btn]').forEach(function(b){ b.addEventListener('click',function(){ var lang=b.getAttribute('data-lang-btn'); root.setAttribute('data-lang',lang);
    document.querySelectorAll('[data-zh]').forEach(function(el){ el.textContent=el.getAttribute('data-'+lang); });
    document.querySelectorAll('[data-ph-zh]').forEach(function(el){ el.setAttribute('placeholder',el.getAttribute('data-ph-'+lang)); });
    press('[data-lang-btn]','data-lang-btn',lang); }); });
  document.querySelectorAll('[data-vp-btn]').forEach(function(b){ b.addEventListener('click',function(){ var vp=b.getAttribute('data-vp-btn'); document.body.classList.toggle('vp800',vp==='800'); press('[data-vp-btn]','data-vp-btn',vp); }); });
  var q = location.search + location.hash;
  var m2 = /(?:^|[#&?])lang=(zh|en)/.exec(q);
  if (m2) { var lb = document.querySelector('[data-lang-btn="'+m2[1]+'"]'); if (lb) lb.click(); }
  var m3 = /(?:^|[#&?])vp=(800|desktop)/.exec(q);
  if (m3) { var vb = document.querySelector('[data-vp-btn="'+m3[1]+'"]'); if (vb) vb.click(); }
})();
</script>
